return`<h2>Tareas<span>captura rápida y bandeja</span></h2><div class="cap"><input id="cap" placeholder="Captura rápida… y Enter"><button class="b" data-a="cap">+</button></div><div class="cap"><input data-f="q" placeholder="Buscar" value="${E(f.q)}"><select data-f="area">${op('',f.area)}${J(AREAS.map(a=>op(a,f.area)))}</select></div><div class="cap"><select data-f="st"><option value="">Abiertas</option>${J(['pendiente','en curso','bloqueada','completada'].map(a=>op(a,f.st)))}</select></div>
<div class="card"><h3>Bandeja (sin clasificar)</h3>${J(ib.map(trow))}${emp(ib,'Bandeja vacía ♡')}</div><div class="card"><h3>Mis tareas</h3>${J(rs.map(trow))}${emp(rs,'Sin tareas con estos filtros')}</div><button class="b" data-a="new" data-t="task">+ Nueva tarea</button>`}
function vCon(){const c=s=>db.videos.filter(v=>v.stage==s).length;return`<h2>Contenido<span>${c('En edición')} en edición · ${c('Por aprobar')} por aprobar · ${c('Programado')} programados</span></h2><div class="kb">${J(ST.map(s=>`<div class="col"><h4>${s} <i>${c(s)}</i></h4>${J(db.videos.filter(v=>v.stage==s).map(v=>`<div class="card kc"><b data-a="ed" data-t="video" data-id="${v.id}">${E(v.title)}</b><small>${E([v.brand,v.platform].filter(Boolean).join(' · '))}</small>${v.due?ch('entrega '+fmt(v.due,sd),v.due<today()&&s!='Publicado'?'red':''):''}${v.next?`<small>→ ${E(v.next)}</small>`:''}<div class="row"><button class="sm" data-a="mv" data-id="${v.id}" data-n="-1">‹</button><button class="sm" data-a="mv" data-id="${v.id}" data-n="1">›</button></div></div>`))}</div>`))}</div><button class="b" data-a="new" data-t="video">+ Nuevo video</button>`}
function vMsg(){return`<h2>Mensajes<span>solo lo que requiere acción</span></h2>`+J(MS.map(s=>{const L=db.msgs.filter(m=>m.status==s).sort(by('follow'));return`<div class="card"><h3>${s}</h3>${J(L.map(m=>`<div class="it"><div class="g1" data-a="ed" data-t="msg" data-id="${m.id}"><b>${E(m.title)}</b><small>${E([m.channel,m.topic].filter(Boolean).join(' · '))}</small>${ch(m.follow&&'seguir '+fmt(m.follow,sd),m.follow&&m.follow<today()&&s!='resuelto'?'red':'')}</div>${s!='resuelto'?`<div class="acts"><button class="sm" data-a="ms" data-id="${m.id}" data-v="esperando respuesta">Enviado</button><button class="sm" data-a="ms" data-id="${m.id}" data-v="snooze">+1d</button><button class="sm" data-a="ms" data-id="${m.id}" data-v="resuelto">✓</button></div>`:''}</div>`))}${emp(L,'—')}</div>`}))+`<button class="b" data-a="new" data-t="msg">+ Nuevo seguimiento</button>`}
function vPro(){return`<h2>Proyectos<span>resultados, no solo tareas</span></h2>`+J(db.projects.map(p=>{const T=db.tasks.filter(x=>x.project==p.id),d=T.filter(x=>x.status=='completada').length;return`<div class="card" data-a="ed" data-t="project" data-id="${p.id}"><h3>${E(p.title)}</h3>${ch(p.area)}${ch(p.status)}${ch(p.target&&'meta '+fmt(p.target,sd))}<p>${E(p.result)}</p><div class="bar"><i style="width:${T.length?Math.round(d/T.length*100):0}%"></i></div><small>${d}/${T.length} tareas ${p.next?'· → '+E(p.next):''}</small></div>`}))+emp(db.projects,'Aún no hay proyectos')+`<button class="b" data-a="new" data-t="project">+ Nuevo proyecto</button>`}
const ps=p=>p.status!='pendiente'?'pagado':!p.due?'pendiente':p.due<today()?'vencido':p.due<=add(today(),7)?'próximo':'pendiente',mny=v=>'S/ '+(+v||0).toFixed(2);
function vFin(){const sm=k=>db.pays.filter(p=>p.kind==k&&p.status=='pendiente').reduce((a,p)=>a+(+p.amount||0),0);return`<h2>Finanzas<span>registro manual en soles</span></h2><div class="grid3" style="grid-template-columns:1fr 1fr"><div class="stat"><b>${mny(sm('por pagar'))}</b>por pagar</div><div class="stat"><b>${mny(sm('por cobrar'))}</b>por cobrar</div></div><div class="card">${J([...db.pays].sort(by('due')).map(p=>{const s=ps(p);return`<div class="it ${s=='pagado'?'dn':''}"><button class="ck" data-a="pay" data-id="${p.id}">${s=='pagado'?'♥':''}</button><div class="g1" data-a="ed" data-t="pay" data-id="${p.id}"><b>${E(p.title)} · ${mny(p.amount)}</b>${ch(p.kind)}${ch(p.due&&fmt(p.due,sd))}${ch(s,s=='vencido'?'red':'')}</div></div>`}))}${emp(db.pays,'Sin pagos registrados')}</div><button class="b" data-a="new" data-t="pay">+ Nuevo pago</button>`}
function vHab(){const m=add(mon(today()),7*S.hw),D=[...Array(7)].map((_,i)=>add(m,i));return`<h2>Hábitos<span>un día en blanco no borra tu progreso</span></h2><div class="row"><button class="b g" data-a="hw" data-n="-1">‹</button><button class="b g" data-a="hw" data-n="0">Hoy</button><button class="b g" data-a="hw" data-n="1">›</button></div><div class="card"><div class="hr"><span></span>${J(D.map(d=>`<b>${fmt(d,{weekday:'narrow'}).toUpperCase()}</b>`))}</div>${J(db.habits.map(h=>`<div class="hr"><div class="g1" data-a="ed" data-t="habit" data-id="${h.id}"><b>${E(h.title)}</b><small>mínimo: ${E(h.min||'—')}</small></div>${J(D.map(d=>`<button class="dot${db.log[h.id+'|'+d]?' on':''}" data-a="hb" data-k="${h.id}|${d}" aria-label="${d}"></button>`))}</div>`))}</div><button class="b" data-a="new" data-t="habit">+ Nuevo hábito</button>`}
function vAju(){return`<h2>Ajustes<span>datos, copia y privacidad</span></h2><div class="card"><h3>Dónde se guardan tus datos</h3><p>Solo en este navegador de este dispositivo (almacenamiento local). No hay sincronización en la nube, no se leen WhatsApp ni Instagram, y no hay notificaciones push. Los recordatorios son visuales dentro del panel.</p><small>Zona horaria America/Lima · semana desde lunes · moneda S/</small></div><div class="card"><h3>Copia de seguridad</h3><textarea id="ex" rows="4">${E(JSON.stringify(db))}</textarea><div class="row"><button class="b g" data-a="copy">Copiar</button><button class="b g" data-a="imp">Importar texto</button></div></div><div class="card"><h3>Limpieza</h3><div class="row"><button class="b g" data-a="demo">Borrar datos de ejemplo</button><button class="b" data-a="reset">${S.rc?'¿Seguro? Toca de nuevo':'Restablecer todo'}</button></div></div>`}
const V={hoy:vHoy,sem:vSem,tar:vTar,con:vCon,msg:vMsg,pro:vPro,fin:vFin,hab:vHab,aju:vAju};
function render(){$('#main').innerHTML=V[S.v]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==S.v));scrollTo(0,0);if(!db.welcomed&&!$('#m').innerHTML)welcome()}
function form(type,it={}){const d=it.id?it:{...DEF[type](),...it};const fl=J(F[type].map(([k,l,t,o])=>{let c;if(t=='sel'||t=='area'||t=='proj'){const op=t=='area'?AREAS:t=='proj'?db.projects.map(p=>[p.id,p.title]):o;c=`<select name="${k}">${t!='sel'?'<option value="">—</option>':''}${J(op.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return`<option value="${E(a)}"${d[k]==a?' selected':''}>${E(b)}</option>`}))}</select>`}else if(t=='ta')c=`<textarea name="${k}" rows="2">${E(d[k])}</textarea>`;else c=`<input name="${k}" type="${t}" value="${E(d[k])}"${t=='number'?' step="0.01" inputmode="decimal"':''}>`;return`<label>${l}${c}</label>`}));
modal(`<h3>${it.id?'Editar':'Nuevo'} · ${TN[type]}</h3>${fl}<div class="row"><button class="b" data-a="save" data-t="${type}" data-id="${it.id||''}">Guardar</button>${it.id?`<button class="b g" data-a="del" data-t="${type}" data-id="${it.id}">Eliminar</button>`:''}</div>`)}
function pick(){const L=db.tasks.filter(x=>x.status!='completada'&&!x.star);modal(`<h3>Elige una prioridad</h3>${J(L.map(x=>`<div class="it"><div class="g1"><b>${E(x.title)}</b></div><button class="sm" data-a="star" data-id="${x.id}">★ elegir</button></div>`))}${emp(L,'Crea una tarea con + Añadir')}`)}
function timer(id){const x=db.tasks.find(y=>y.id==id);let s=600;modal(`<h3>10 minutos ♡</h3><p><b>${E(x?x.title:'')}</b></p><p>${E(x&&x.next||'¿Cuál es la acción más pequeña para empezar?')}</p><div class="clk" id="clk">10:00</div><div class="row"><button class="b" data-a="x">Cerrar</button></div>`);clearInterval(tm);tm=setInterval(()=>{s--;const c=$('#clk');if(!c){clearInterval(tm);return}c.textContent=s>0?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):'¡Listo! ¿Sigues o descansas?';if(s<=0)clearInterval(tm)},1000)}
function welcome(){$('#m').innerHTML=`<div class="mb mw"><div class="mc"><div class="brand" style="font-size:30px">${BRAND}</div><h3>Bienvenida ♡</h3><p>Tu organizador para soltar la carga mental: capturas todo, eliges 3 prioridades y empiezas por 10 minutos.</p><label>¿Cómo te llamas?<input id="nm" placeholder="Tu nombre"></label><small>Tus datos se guardan solo en este dispositivo.</small><div class="row"><button class="b" data-a="start">Empezar</button><button class="b g" data-a="loaddemo">Ver con ejemplos</button></div></div></div>`}
function capture(){const i=$('#cap');if(i&&i.value.trim()){db.tasks.push({id:uid(),title:i.value.trim(),status:'pendiente',prio:'media',dur:'10'});save();render();toast('Guardado en la bandeja ♡')}}
document.addEventListener('click',e=>{if(e.target.classList.contains('mb')&&!e.target.classList.contains('mw'))return closeM();const el=e.target.closest('[data-a]');if(!el)return;const D=el.dataset,a=D.a,id=D.id,t=today(),f=(L,i)=>db[L].find(x=>x.id==i);
switch(a){
case'nav':S.v=D.v;S.rc=0;break;case'x':closeM();return;
case'add':modal(`<h3>¿Qué quieres añadir?</h3><div class="ty">${J(Object.keys(TN).map(k=>`<button data-a="new" data-t="${k}">${ico(TI[k])}${TN[k]}</button>`))}</div>`);return;
case'new':form(D.t);return;case'addd':form('event',{date:D.d});return;case'ed':form(D.t,db[C[D.t]].find(x=>x.id==id));return;
case'save':{const o={};document.querySelectorAll('.mc [name]').forEach(i=>o[i.name]=i.value.trim());if(!o.title)return toast('Pon un título ♡');if('amount'in o)o.amount=+o.amount||0;const L=db[C[D.t]],it=L.find(x=>x.id==id);it?Object.assign(it,o):L.push({id:uid(),...o});break}
case'del':db[C[D.t]]=db[C[D.t]].filter(x=>x.id!=id);break;
case'tog':{const x=f('tasks',id);x.status=x.status=='completada'?'pendiente':'completada';if(x.status=='completada')x.star=0;break}
case'star':{const x=f('tasks',id);if(!x.star&&db.tasks.filter(y=>y.star&&y.status!='completada').length>=3){toast('Solo 3 prioridades destacadas ♡');return}x.star=x.star?0:1;break}
case'tmr':f('tasks',id).date=add(t,1);break;case'pick':pick();return;case't10':if(!id){pick();return}timer(id);return;
case'wk':S.w=D.n=='0'?0:S.w+ +D.n;break;case'hw':S.hw=D.n=='0'?0:S.hw+ +D.n;break;
case'mv':{const v=f('videos',id),i=ST.indexOf(v.stage)+ +D.n;if(i>=0&&i<ST.length)v.stage=ST[i];break}
case'ms':{const m=f('msgs',id);if(D.v=='snooze')m.follow=add(m.follow&&m.follow>t?m.follow:t,1);else m.status=D.v;break}
case'pay':{const p=f('pays',id);p.status=p.status=='pendiente'?'pagado/cobrado':'pendiente';break}
case'hb':db.log[D.k]?delete db.log[D.k]:db.log[D.k]=1;break;
case'cap':capture();return;
case'copy':{const x=$('#ex');x.select();try{navigator.clipboard.writeText(x.value)}catch(_){}toast('Copiado ♡');return}
case'imp':try{db={...blank(),...JSON.parse($('#ex').value)};toast('Datos importados ♡')}catch(_){toast('Texto no válido');return}break;
case'demo':for(const k of Object.values(C))db[k]=db[k].filter(x=>!x.demo);toast('Datos de ejemplo borrados');break;
case'reset':if(!S.rc){S.rc=1;render();return}db=blank();S.rc=0;toast('App restablecida');break;
case'start':db.name=$('#nm')?$('#nm').value.trim():'';db.welcomed=1;break;
case'loaddemo':{const nm=$('#nm')?$('#nm').value.trim():'';db={...seed(),name:nm,welcomed:1};break}
default:return}
save();closeM();render()});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='cap')capture()});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.f){S.f[d.f]=e.target.value;render()}if(e.target.id=='wg'){db.wg[d.w]=e.target.value;save()}});
$('#nav').innerHTML=J(NAV.map(([k,l])=>`<button data-a="nav" data-v="${k}">${ico(k)}${l}</button>`));$('#bn').textContent=BRAND;document.title=BRAND;render();
</script></body></html>
